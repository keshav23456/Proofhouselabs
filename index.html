      {
        "@type": "Question",
        "name": "How is this different from a public benchmark?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Public benchmarks measure general capability on tasks nobody in particular asked for. Proofhouse builds a scoreable distribution from your own production traffic, so the certification answers whether the cheaper stack holds up on the tasks you actually get."
        }
      },
      {
        "@type": "Question",
        "name": "Why does Proofhouse use open-weight models for the verifier?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Frontier APIs don't expose full logprobs, and a verifier without calibrated confidence is just another model guessing. Open-weight models provide the probability distribution needed to measure agreement reliably against a human-labeled holdout."
        }
      },
      {
        "@type": "Question",
        "name": "What do teams get at the end of a certification run?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A signed certification report with a quality delta, a cost delta, and the specific failure cases the candidate model stack still gets wrong, plus raw scored transcripts."
